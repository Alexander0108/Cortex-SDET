name: Cortex-SDET Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: pytest api_tests/ -v --tb=short

      - name: Run SQL tests
        run: pytest sql_tests/ -v --tb=short

      - name: Run Data-Driven tests
        run: pytest data_driven_tests/ -v --tb=short

      - name: Run all tests combined
        run: pytest api_tests/ sql_tests/ data_driven_tests/ -v --tb=short
